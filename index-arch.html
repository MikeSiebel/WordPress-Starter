<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Game Store — Dev</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        font-family: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI",
          Roboto, sans-serif;
        background-color: #0b0f19;
        color: #ffffff;
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
        overflow: hidden;
      }

      .container {
        text-align: center;
        padding: 2rem;
        max-width: 600px;
      }

      .logo {
        font-size: 2.5rem;
        font-weight: 800;
        letter-spacing: 2px;
        margin-bottom: 1rem;
        background: linear-gradient(135deg, #3b82f6 0%, #8b5cf6 100%);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
      }

      h1 {
        font-size: 1.8rem;
        margin-bottom: 1rem;
        font-weight: 600;
      }

      p {
        color: #94a3b8;
        font-size: 1rem;
        line-height: 1.6;
        margin-bottom: 2rem;
      }

      .loader {
        display: inline-block;
        width: 40px;
        height: 40px;
        border: 3px solid rgba(59, 130, 246, 0.2);
        border-radius: 50%;
        border-top-color: #3b82f6;
        animation: spin 1s ease-in-out infinite;
      }

      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }
    </style>
  </head>
  <body>
    <div class="container">
      <div class="logo">GAME STORE</div>
      <h1>Ведутся технические работы (Dev)</h1>
      <p>
        Мы создаем для вас лучший интернет-магазин видеоигр и аксессуаров.
        Совсем скоро здесь появится что-то невероятное!
      </p>
      <div class="loader"></div>
    </div>
  </body>
</html>
