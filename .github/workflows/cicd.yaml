name: WordPress Deploy

on:
  push:
    branches:
      - dev
  release:
    types: [published]

jobs:
  prepare:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare WordPress Zip
        run: |
          WP_LINK=$(cat wp-version-control.cfg)
          wget -O "./wordpress.zip" "$WP_LINK"

      - name: Prepare plugins and theme zip
        run: zip -r wpcontent.zip plugins mu-plugins themes

      - name: Check deployment files
        run: |
          ls -lh wordpress.zip wpcontent.zip
          test -s wordpress.zip
          test -s wpcontent.zip

  deploy:
    needs: prepare
    runs-on: ubuntu-latest

    env:
      DEPLOY_PATH: ${{ github.event_name == 'push' && secrets.DEV_DEPLOY_PATH || secrets.PROD_DEPLOY_PATH }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check deployment secrets
        id: secrets
        shell: bash
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_PASSWORD: ${{ secrets.SSH_PASSWORD }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
          DEPLOY_PATH: ${{ env.DEPLOY_PATH }}
        run: |
          if [ -n "$SSH_HOST" ] && \
             [ -n "$SSH_USER" ] && \
             [ -n "$SSH_PASSWORD" ] && \
             [ -n "$SSH_PORT" ] && \
             [ -n "$DEPLOY_PATH" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
            echo "Deployment secrets are configured."
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "Deployment secrets are not configured."
            echo "Deployment will be skipped."
          fi

      - name: Prepare WordPress Zip
        if: steps.secrets.outputs.configured == 'true'
        run: |
          WP_LINK=$(cat wp-version-control.cfg)
          wget -O "./wordpress.zip" "$WP_LINK"

      - name: Prepare plugins and theme zip
        if: steps.secrets.outputs.configured == 'true'
        run: zip -r wpcontent.zip plugins mu-plugins themes

      - name: Copy Zips to Server
        if: steps.secrets.outputs.configured == 'true'
        uses: appleboy/scp-action@v1
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          password: ${{ secrets.SSH_PASSWORD }}
          port: ${{ secrets.SSH_PORT }}
          source: "wordpress.zip,wpcontent.zip"
          target: ${{ env.DEPLOY_PATH }}

      - name: Enable Maintenance Mode
        if: steps.secrets.outputs.configured == 'true'
        uses: appleboy/ssh-action@v1.0.3
        env:
          DEPLOY_PATH: ${{ env.DEPLOY_PATH }}
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          password: ${{ secrets.SSH_PASSWORD }}
          port: ${{ secrets.SSH_PORT }}
          envs: DEPLOY_PATH
          script: |
            cat > "$DEPLOY_PATH/.maintenance" <<'EOF'
            <?php
            $upgrading = time();
            ?>
            EOF

      - name: Update WordPress Core
        if: steps.secrets.outputs.configured == 'true'
        uses: appleboy/ssh-action@v1.0.3
        env:
          DEPLOY_PATH: ${{ env.DEPLOY_PATH }}
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          password: ${{ secrets.SSH_PASSWORD }}
          port: ${{ secrets.SSH_PORT }}
          envs: DEPLOY_PATH
          script: |
            find "$DEPLOY_PATH" -type f -name "*.php" ! -name "wp-config.php" -delete

            rm -rf \
              "$DEPLOY_PATH/wp-admin/" \
              "$DEPLOY_PATH/wp-includes/"

            unzip -o "$DEPLOY_PATH/wordpress.zip" -d "$DEPLOY_PATH/"

            mv "$DEPLOY_PATH/wordpress"/* "$DEPLOY_PATH/"

            rm -rf "$DEPLOY_PATH/wordpress"

      - name: Update Plugins and Theme
        if: steps.secrets.outputs.configured == 'true'
        uses: appleboy/ssh-action@v1.0.3
        env:
          DEPLOY_PATH: ${{ env.DEPLOY_PATH }}
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          password: ${{ secrets.SSH_PASSWORD }}
          port: ${{ secrets.SSH_PORT }}
          envs: DEPLOY_PATH
          script: |
            rm -rf \
              "$DEPLOY_PATH/wp-content/plugins" \
              "$DEPLOY_PATH/wp-content/mu-plugins" \
              "$DEPLOY_PATH/wp-content/themes"

            unzip -o "$DEPLOY_PATH/wpcontent.zip" -d "$DEPLOY_PATH/wp-content/"

      - name: Disable Maintenance Mode and Remove zips
        if: steps.secrets.outputs.configured == 'true'
        uses: appleboy/ssh-action@v1.0.3
        env:
          DEPLOY_PATH: ${{ env.DEPLOY_PATH }}
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          password: ${{ secrets.SSH_PASSWORD }}
          port: ${{ secrets.SSH_PORT }}
          envs: DEPLOY_PATH
          script: |
            rm -f \
              "$DEPLOY_PATH/.maintenance" \
              "$DEPLOY_PATH/wpcontent.zip" \
              "$DEPLOY_PATH/wordpress.zip"